name: Tests

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4

      - name: "Download dependencies"
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libgoogle-perftools-dev

      - name: "Make"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: "Build"
        run: cmake --build build -j

      - name: "Run unit tests"
        working-directory: build
        run: ctest --output-on-failure
